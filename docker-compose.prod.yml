version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boilerplate_network

  redis:
    image: redis:7-alpine
    container_name: boilerplate_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - boilerplate_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: boilerplate_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    env_file:
      - ./backend/.env.production
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boilerplate_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: boilerplate_frontend_prod
    restart: always
    env_file:
      - ./frontend/.env.production
    expose:
      - '3000'
    depends_on:
      - backend
    networks:
      - boilerplate_network

  nginx:
    image: nginx:alpine
    container_name: boilerplate_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - boilerplate_network

volumes:
  postgres_data:
  redis_data:

networks:
  boilerplate_network:
    driver: bridge
